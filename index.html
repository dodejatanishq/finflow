    // Helper for formatting INR currency
    const formatINR = (amount) => {
      if (isNaN(amount) || amount === null || amount === undefined) return '₹0';
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(amount);
    };

    // Standard Reducing-Balance EMI calculation
    const calculateEMI = (p, r, n) => {
      const principal = parseFloat(p) || 0;
      const rate = parseFloat(r) || 0;
      const tenure = parseFloat(n) || 0;

      if (principal <= 0 || tenure <= 0) {
        return { emi: 0, totalPayment: 0, totalInterest: 0 };
      }

      if (rate <= 0) {
        const emi = principal / tenure;
        return {
          emi: Math.round(emi),
          totalPayment: Math.round(principal),
          totalInterest: 0
        };
      }

      const monthlyRate = rate / 12 / 100;
      const emi = (principal * monthlyRate * Math.pow(1 + monthlyRate, tenure)) / (Math.pow(1 + monthlyRate, tenure) - 1);
      const totalPayment = emi * tenure;
      const totalInterest = totalPayment - principal;

      return {
        emi: Math.round(emi),
        totalPayment: Math.round(totalPayment),
        totalInterest: Math.round(totalInterest)
      };
    };

                      value={rate}
                      onChange={(e) => setRate(Math.max(0, Number(e.target.value)))}

                  type="range" 
                  min="6" 
                  max="24" 
                  step="0.25"
                  value={rate} 
                  onChange={(e) => setRate(Number(e.target.value))}
                  className="w-full accent-[#12A594] h-2 bg-slate-200 rounded-lg cursor-pointer"
                />

                  <span>6%</span>
                  <span>24%</span>

                <div className="flex justify-between items-center text-xs font-bold text-slate-700">
                  <label htmlFor="tenureInput">{t.calcSection.tenure}</label>
                  <div className="flex items-center gap-1 bg-slate-50 border border-slate-300 rounded-lg px-2 py-1">
                    <input 
                      id="tenureInput"
                      type="number" 
                      value={tenure}
                      onChange={(e) => setTenure(Math.max(1, Number(e.target.value)))}
                      className="w-16 text-right bg-transparent text-slate-900 font-extrabold focus:outline-none"
                      step="6"
                    />
                    <span className="text-slate-400 text-[11px]">Mo</span>
                  </div>
                </div>
                <input 
                  type="range" 
                  min="6" 
                  max="360" 
                  step="6"
                  value={tenure} 
                  onChange={(e) => setTenure(Number(e.target.value))}
                  className="w-full accent-[#12A594] h-2 bg-slate-200 rounded-lg cursor-pointer"
                />
                <div className="flex justify-between text-[10px] text-slate-400 font-mono">
                  <span>6 Months</span>
                  <span>30 Years (360 Mo)</span>
                </div>
              </div>

                <button 
                  onClick={() => { setAmount(500000); setRate(12); setTenure(60); }}
                  className="text-xs text-slate-400 hover:text-slate-600 underline font-medium"
                >
                  {t.calcSection.reset}
                </button>
              </div>

            </div>

            {/* Results Column */}
            <div className="lg:col-span-5 bg-[#10243A] text-white rounded-2xl p-6 space-y-6 shadow-xl flex flex-col justify-between h-full">
              
              <div>
                <span className="text-[10px] uppercase tracking-wider text-slate-400 font-bold block mb-1">
                  {t.calcSection.emiResult}
                </span>
                <p className="text-3xl font-extrabold text-[#12A594]">
                  {formatINR(emi)} <span className="text-xs font-normal text-slate-400">/ month</span>
                </p>
              </div>

              <div className="space-y-3 border-t border-slate-800 pt-4 text-xs">
                <div className="flex justify-between items-center text-slate-300">
                  <span>Principal Loan Amount:</span>
                  <span className="font-bold text-white">{formatINR(amount)}</span>
                </div>
                <div className="flex justify-between items-center text-slate-300">
                  <span>{t.calcSection.totalInterest}:</span>
                  <span className="font-bold text-emerald-400">{formatINR(totalInterest)}</span>
                </div>
                <div className="flex justify-between items-center text-slate-200 border-t border-slate-800/80 pt-2 font-bold text-sm">
                  <span>{t.calcSection.totalPayment}:</span>
                  <span className="text-white">{formatINR(totalPayment)}</span>
                </div>
              </div>

              {/* Breakdown Bar */}
              {totalPayment > 0 && (
                <div className="space-y-1.5">
                  <div className="h-2 rounded-full bg-slate-800 overflow-hidden flex">
                    <div 
                      className="bg-[#12A594] h-full" 
                      style={{ width: `${Math.min(100, Math.max(0, (amount / totalPayment) * 100))}%` }}
                    ></div>
                    <div 
                      className="bg-emerald-400 h-full" 
                      style={{ width: `${Math.min(100, Math.max(0, (totalInterest / totalPayment) * 100))}%` }}
                    ></div>
                  </div>
                  <div className="flex justify-between text-[10px] text-slate-400">
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#12A594]"></span> Principal ({Math.round((amount/totalPayment)*100)}%)</span>
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-emerald-400"></span> Interest ({Math.round((totalInterest/totalPayment)*100)}%)</span>
                  </div>
                </div>
              )}

              <a 
                href={createWhatsAppURL(whatsappShareMessage)}
                onClick={(e) => openWhatsApp(e, whatsappShareMessage)}
                target="_blank"
                rel="noopener noreferrer"
                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow transition cursor-pointer"
              >
                <MessageSquareIcon className="w-4 h-4 fill-current" /> {t.calcSection.shareWA}
              </a>

            </div>

          </div>
        </div>
      );

                <div className="w-10 h-10 rounded-xl bg-[#12A594]/20 text-[#12A594] flex items-center justify-center shrink-0">
                  <MapPinIcon className="w-5 h-5" />
                </div>
                <div>
                  <p className="text-slate-400 text-xs">Service Location</p>
                  <p className="font-bold text-white text-base">Bilaspur, Chhattisgarh, India</p>
                </div>
              </div>
            </div>

            <div className="pt-4">
              <a 
                href={createWhatsAppURL(lang === 'hi' ? "नमस्ते तरंग जी, मैं बिलासपुर में लोन परामर्श के लिए चैट करना चाहता हूँ।" : "Hello Tarang, I want to chat about loan options in Bilaspur.")}
                onClick={(e) => openWhatsApp(e, lang === 'hi' ? "नमस्ते तरंग जी, मैं बिलासपुर में लोन परामर्श के लिए चैट करना चाहता हूँ।" : "Hello Tarang, I want to chat about loan options in Bilaspur.")}
                target="_blank"
                rel="noopener noreferrer"
                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3.5 rounded-xl flex items-center justify-center gap-2 shadow cursor-pointer"
              >
                <MessageSquareIcon className="w-4 h-4 fill-current" /> Connect on WhatsApp
              </a>
            </div>
          </div>
        </div>
      );
    }

    function FaqPage({ lang, t, navigateTo }) {
      const [openIdx, setOpenIdx] = useState(0);

      const faqs = [
        { q: "What loan categories does FinFlow Solutions assist with?", a: "We provide guidance for Business Loans, Home Loans, Loans Against Property (LAP), Personal Loans, and Vehicle Loans." },
        { q: "Are loan approvals guaranteed by FinFlow Solutions?", a: "No. Loan approval, interest rates, tenure, and disbursal are strictly subject to evaluation and policy approval by lending banks and NBFCs." },
        { q: "Is there any upfront fee charged for consulting services?", a: "FinFlow Solutions does not collect unauthorized registration or processing fees from clients directly." },
        { q: "Can self-employed or business owners apply without GST?", a: "Yes, depending on turnover and alternative banking records, several loan options exist for non-GST proprietors." },
        { q: "How can I contact Tarang Gogiya directly?", a: "You can click any of the WhatsApp buttons on this website to connect directly on WhatsApp at +91 8085614780." }
      ];

      return (
        <div className="max-w-3xl mx-auto px-4 py-12 space-y-8">
          <h1 className="text-3xl font-extrabold text-slate-900 text-center">Frequently Asked Questions</h1>
          
          <div className="space-y-3">
            {faqs.map((faq, idx) => (
              <div key={idx} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                <button 
                  onClick={() => setOpenIdx(openIdx === idx ? null : idx)}
                  className="w-full text-left p-4 font-bold text-xs sm:text-sm text-slate-900 flex justify-between items-center"
                >
                  <span>{faq.q}</span>
                  <ChevronDownIcon className={`w-4 h-4 transition-transform ${openIdx === idx ? 'rotate-180 text-[#12A594]' : ''}`} />
                </button>
                {openIdx === idx && (
                  <div className="p-4 pt-0 text-xs text-slate-600 border-t border-slate-100 bg-slate-50/50 leading-relaxed">
                    {faq.a}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PrivacyPolicyPage() {
      return (
        <div className="max-w-3xl mx-auto px-4 py-12 text-xs text-slate-700 space-y-4">
          <h1 className="text-2xl font-bold text-slate-900">Privacy Policy</h1>
          <p>FinFlow Solutions (operated by Tarang Gogiya in Bilaspur) respects your privacy. This website does not store or process personal loan applications or applicant banking information on public database servers.</p>
          <p>Any communication initiated via WhatsApp occurs directly through your device's applications.</p>
        </div>
      );
    }

    function TermsPage() {
      return (
        <div className="max-w-3xl mx-auto px-4 py-12 text-xs text-slate-700 space-y-4">
          <h1 className="text-2xl font-bold text-slate-900">Terms & Conditions</h1>
          <p>FinFlow Solutions operates as a Direct Selling Agent and consulting platform. Usage of this website implies agreement that EMI calculators are for indicative educational purposes only.</p>
        </div>
      );
    }

    function DisclaimerPage({ lang, t }) {
      return (
        <div className="max-w-3xl mx-auto px-4 py-12 text-xs text-slate-700 space-y-4">
          <h1 className="text-2xl font-bold text-slate-900">Full Disclaimer</h1>
          <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 leading-relaxed space-y-3">
            <p className="font-semibold text-slate-900">
              {t.disclaimerText}
            </p>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
